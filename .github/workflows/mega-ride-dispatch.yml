name: Mega Ride Dispatch

on:
  push:
    branches:
      - main
      - develop
      - release/*
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: 

env:
  APP_ENV: testing
  APP_DEBUG: true
  APP_URL: http://localhost
  DB_CONNECTION: sqlite
  DB_DATABASE: database/testing.sqlite

jobs:
  # Job 1: Code Quality & Static Analysis
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2  # ← Changed from 8.3 to 8.2
          extensions: mbstring, bcmath, intl, pdo, sqlite, openssl, zip, pcntl
          coverage: xdebug
          tools: composer, phpcs, phpstan
          
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ runner.os }}-8.2-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-8.2-
            composer-${{ runner.os }}-
            
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        
      # ... rest of code-quality steps remain the same

  # Job 2: Unit & Feature Tests
  tests:
    name: PHP ${{ matrix.php-version }} - ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: code-quality
    
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2']  # ← Only test PHP 8.2
        database: ['sqlite', 'mysql']
        include:
          - database: mysql
            db_port: 3306
          - database: sqlite
            db_port: 0
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, bcmath, intl, pdo, ${{ matrix.database }}, openssl, zip, pcntl, redis
          coverage: xdebug
          ini-values: memory_limit=2G
          
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php-version }}-
            composer-${{ runner.os }}-
            
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
        
      # ... rest of tests steps remain the same

  # Job 3: Security Checks
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2  # ← Changed from 8.3 to 8.2
          extensions: mbstring, bcmath, intl
          
      # ... rest of security steps remain the same

  # Job 4: Performance & Build
  build:
    name: Build & Optimize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [tests, security]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2  # ← Changed from 8.3 to 8.2
          extensions: mbstring, bcmath, intl, pdo, sqlite, openssl, zip, pcntl
          
      # ... rest of build steps remain the same

  # Job 5: Notification (FIXED)
  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    
    steps:
      - name: Check workflow status
        id: status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "status=Pipeline Succeeded" >> $GITHUB_OUTPUT
            echo "color=3066993" >> $GITHUB_OUTPUT
          else
            echo "status=Pipeline Failed" >> $GITHUB_OUTPUT
            echo "color=15158332" >> $GITHUB_OUTPUT
          fi
          
      - name: Send Slack notification
        if: failure() && github.ref == 'refs/heads/main'
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          
      - name: Send Discord notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Laravel CI Pipeline"
          description: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          color: ${{ steps.status.outputs.color }}
