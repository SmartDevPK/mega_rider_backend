name: Laravel Database Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: 

env:
  APP_ENV: testing
  APP_DEBUG: true
  APP_URL: http://localhost
  DB_CONNECTION: sqlite
  DB_DATABASE: database/testing.sqlite

jobs:
  tests:
    name: Laravel Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, bcmath, intl, pdo, sqlite, openssl, zip, pcntl
          coverage: none
          tools: composer
          
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-
            
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        
      - name: Copy environment file
        run: cp .env.example .env
        
      - name: Generate application key
        run: php artisan key:generate
        
      - name: Create testing database
        run: |
          mkdir -p database
          touch database/testing.sqlite
          
      - name: Run migrations
        run: php artisan migrate --no-interaction -v
        
      - name: Run Database Schema Tests
        run: php artisan test --filter DatabaseSchemaTest --no-interaction --verbose
        
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: storage/logs/